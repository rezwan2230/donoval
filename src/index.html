  <script>
    var textWrapper = document.querySelector('.tagline');
    textWrapper.innerHTML = textWrapper.textContent.replace(/\S/g, "<span class='letter'>$&</span>");

    anime.timeline({ loop: false })
      .add({
        targets: '.tagline .letter',
        opacity: [0, 1],
        easing: "easeInOutQuad",
        duration: 3800,
        delay: (el, i) => 150 * (i + 1)
      }).add({
        targets: '.tagline',
        opacity: 1,
        duration: 300,
        easing: "easeOutExpo",
        delay: 500
      });
  </script>
