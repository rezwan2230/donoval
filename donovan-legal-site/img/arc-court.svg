<text x="80" y="551" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#F6F5F1">Donovan Legal represents taxpayers at every stage on this line — including the last two.</text>
<text x="80" y="572" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C6D8CC">A law firm can file the petition and try the case. An accounting or advisory firm has to hand the matter to someone who can.</text>
<line x1="52" y1="598" x2="1508" y2="598" stroke="#DAD8D2" stroke-width="1"/>
<text x="52" y="622" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6E6E6E">General information about tax procedure — not legal advice. Procedure and deadlines are specific to each matter.</text>
