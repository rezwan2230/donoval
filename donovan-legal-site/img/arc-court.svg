<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1560 678" role="img" aria-labelledby="arc-t arc-d">
<title id="arc-t">The tax controversy resolution arc</title>
<desc id="arc-d">A map of the federal tax controversy pipeline: planning, coming forward before the Service makes contact, notice, examination, IRS Appeals, United States Tax Court and appellate review, with a collection branch. Resolution is available at every stage after a notice issues. Donovan Legal represents taxpayers at every stage, including United States Tax Court and appellate review. This page covers the Tax Court stage.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#12643F"/></marker></defs>
<rect width="1560" height="678" fill="#F6F5F1"/>
<text x="52" y="56" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3.4" font-weight="700" fill="#C9A961">THE ARC</text>
<text x="52" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#1B1B1B">Every controversy ends somewhere. The question is where.</text>
<text x="52" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#434343">Most matters resolve long before the courthouse — but only a firm that can go there can price that risk honestly.</text>
