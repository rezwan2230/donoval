<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 660 1088" role="img" aria-labelledby="m-t m-d">
<title id="m-t">The tax controversy resolution arc</title>
<desc id="m-d">The stages of a tax controversy in order: planning, coming forward before the Service makes contact, notice, examination, IRS Appeals, United States Tax Court, and the court of appeals, with a collection branch after notice. Resolution is possible at every stage after a notice issues.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#12643F"/></marker></defs>
<rect width="660" height="1088" fill="#F6F5F1"/>
<text x="24" y="46" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.6" font-weight="700" fill="#C9A961">THE ARC</text>
<text x="24" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#1B1B1B">Every controversy ends</text>
<text x="24" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#1B1B1B">somewhere.</text>
<line x1="24" y1="130" x2="636" y2="130" stroke="#C9A961" stroke-width="1.3"/>
<rect x="24" y="152" width="612" height="84" rx="3" fill="#FFFFFF" stroke="#0C5334" stroke-width="1.5"/>
<text x="44" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#0C5334">Planning</text>
<text x="44" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#434343">Structuring, before there is a problem</text>
<line x1="58" y1="239" x2="58" y2="260" stroke="#12643F" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="24" y="266" width="612" height="84" rx="3" fill="#0C5334" stroke="#C9A961" stroke-width="3"/>
<text x="44" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#F6F5F1">Coming Forward</text>
<text x="44" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#C6D8CC">A problem exists. No contact yet.</text>
<rect x="506" y="288" width="112" height="26" rx="13" fill="#C9A961"/>
<text x="562" y="306" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.2" font-weight="700" fill="#0C5334">YOU ARE HERE</text>
<line x1="58" y1="353" x2="58" y2="374" stroke="#12643F" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="76" y="371" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" font-weight="700" fill="#C9A961">RESOLUTION POSSIBLE HERE</text>
<rect x="24" y="380" width="612" height="84" rx="3" fill="#FFFFFF" stroke="#0C5334" stroke-width="1.5"/>
<text x="44" y="414" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#0C5334">Notice</text>
<text x="44" y="438" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#434343">The Service makes contact</text>
<line x1="58" y1="467" x2="58" y2="488" stroke="#12643F" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="76" y="485" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" font-weight="700" fill="#C9A961">RESOLUTION POSSIBLE HERE</text>
<line x1="58" y1="474" x2="324" y2="474" stroke="#8C2026" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="332" y="478" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8C2026">→ Collection: liens &amp; levies</text>
<rect x="24" y="494" width="612" height="84" rx="3" fill="#FFFFFF" stroke="#0C5334" stroke-width="1.5"/>
<text x="44" y="528" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#0C5334">Examination</text>
<text x="44" y="552" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#434343">The record is built</text>
<line x1="58" y1="581" x2="58" y2="602" stroke="#12643F" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="76" y="599" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" font-weight="700" fill="#C9A961">RESOLUTION POSSIBLE HERE</text>
<rect x="24" y="608" width="612" height="84" rx="3" fill="#FFFFFF" stroke="#0C5334" stroke-width="1.5"/>
<text x="44" y="642" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#0C5334">IRS Appeals</text>
<text x="44" y="666" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#434343">Hazards of litigation</text>
<line x1="58" y1="695" x2="58" y2="716" stroke="#12643F" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="76" y="713" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" font-weight="700" fill="#C9A961">RESOLUTION POSSIBLE HERE</text>
<rect x="24" y="722" width="612" height="84" rx="3" fill="#FFFFFF" stroke="#0C5334" stroke-width="1.5"/>
<text x="44" y="756" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#0C5334">Tax Court</text>
<text x="44" y="780" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#434343">Contested before payment</text>
<line x1="58" y1="809" x2="58" y2="830" stroke="#12643F" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="76" y="827" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.4" font-weight="700" fill="#C9A961">RESOLUTION POSSIBLE HERE</text>
<rect x="24" y="836" width="612" height="84" rx="3" fill="#FFFFFF" stroke="#0C5334" stroke-width="1.5"/>
<text x="44" y="870" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#0C5334">Court of Appeals</text>
<text x="44" y="894" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#434343">Review of the decision</text>
<rect x="24" y="936" width="612" height="96" fill="#0C5334"/>
<rect x="24" y="936" width="5" height="96" fill="#C9A961"/>
<text x="46" y="966" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#F6F5F1">Donovan Legal represents you</text>
<text x="46" y="989" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#F6F5F1">at every stage — including the last two.</text>
<text x="46" y="1014" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#C6D8CC">A law firm can try the case. An advisory firm hands it off.</text>
<line x1="24" y1="1048" x2="636" y2="1048" stroke="#DAD8D2" stroke-width="1"/>
<text x="24" y="1066" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6E6E6E">General information — not legal advice.</text>
<text x="636" y="1066" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="1.2" font-weight="700" fill="#C9A961">DONOVAN LEGAL PLLC</text>
</svg>