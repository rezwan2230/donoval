# Google Cloud Build — Donovan Law Site
# Builds Docker image and deploys to Cloud Run
#
# Substitutions (set in trigger or override):
#   _REGION: Cloud Run region (default: us-east1)
#   _SERVICE_NAME: Cloud Run service name (default: donovan-law-site)

steps:
  # Build the container image with Kaniko (cached)
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=${_ARTIFACT_REGISTRY}/${PROJECT_ID}/donovan-law/${_SERVICE_NAME}:${_TAG}'
      - '--destination=${_ARTIFACT_REGISTRY}/${PROJECT_ID}/donovan-law/${_SERVICE_NAME}:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--context=.'
      - '--dockerfile=Dockerfile'
    id: 'build-image'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_ARTIFACT_REGISTRY}/${PROJECT_ID}/donovan-law/${_SERVICE_NAME}:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--concurrency=80'
      - '--timeout=60s'
    id: 'deploy'
    waitFor: ['build-image']

  # Smoke test — verify the deployment is healthy
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: bash
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        echo "Testing: $${SERVICE_URL}/healthz"
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$${SERVICE_URL}/healthz")
        if [ "$$STATUS" = "200" ]; then
          echo "Health check passed (200 OK)"
        else
          echo "Health check FAILED (HTTP $$STATUS)"
          exit 1
        fi
    id: 'smoke-test'
    waitFor: ['deploy']

substitutions:
  _REGION: 'us-east1'
  _SERVICE_NAME: 'donovan-law-site'
  _ARTIFACT_REGISTRY: 'us-east1-docker.pkg.dev'
  _TAG: 'latest'  # Overridden by trigger: SHORT_SHA for git-triggered builds

options:
  logging: CLOUD_LOGGING_ONLY
